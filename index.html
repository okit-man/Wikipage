<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wikipedia</title>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <section class="central">
        <div class="central-logo">
            <img src="./image/wiki-logo.png" alt="wiki-logo" class="central-fetured-logo" style="width: 200px; height: 180px;">
            <h1 class="central-text-wrapper">
                <span class="central-text-logo">Search WikipediA</span><br>
                <strong class="cental-small-textlogo">The Free Encyclopedia</strong>
            </h1>
            <form action="" class="form">
                <input type="text" name="search" id="searchInput" class="search-input">
                <button type="submit" class="submit">
                    <i class="fa-sharp fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>
    </section>
